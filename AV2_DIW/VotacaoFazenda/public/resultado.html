<!DOCTYPE html>
<html lang="pt-BR" lang="pt-BR">
<head>
  <meta charset="UTF-8" charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado</title>
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/resultado.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <div>
    <div class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img class="logotipo rounded" src="img/logo-fazenda.jpg" alt="erro" width="76" height="56">
          <span>Votação 2026</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="votacao.html">Votar</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="resultado.html">Resultado</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="container flex-grow-1 py-5">
    <h1>Parcial da eliminação</h1>
    <p class="mb-4"><span class="total-votos display-6" id="total-votos">0</span> <span id="legenda-total">votos computados</span></p>
    <p id="mensagem-resultado" role="status">Carregando resultado...</p>
    <div class="alert alert-light d-none" id="sem-votos">
      Nenhum voto por aqui ainda. <a class="alert-link" href="votacao.html">Seja o primeiro a votar!</a>
    </div>

    <div class="d-flex flex-column gap-3" id="placar" aria-label="Resultado por participante"></div>
    <button class="btn btn-outline-light mt-4" type="button" id="abrir-confirmacao" data-bs-toggle="modal" data-bs-target="#modal-zerar" disabled>Zerar votação</button>

    <template id="modelo-resultado">
      <div class="card cartao-resultado border-0">
        <div class="card-body d-flex flex-column flex-sm-row align-items-sm-center gap-3">
          <img class="foto-resultado rounded img-fluid" src="" alt="erro" width="160" height="90">
          <div class="flex-grow-1">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <h2 class="titulo-cartao h4 mb-0"></h2>
              <span class="badge bg-danger d-none">Sairia hoje</span>
            </div>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar barra-votos"></div>
            </div>
            <p class="contagem fw-bold mt-1 mb-0"></p>
          </div>
        </div>
      </div>
    </template>
  </div>

  <div class="modal fade" id="modal-zerar" tabindex="-1" aria-labelledby="titulo-modal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="titulo-modal">Zerar votação?</h2>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">Todos os votos serão apagados. Deseja continuar?</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" type="button" id="confirmar-zerar">Sim, zerar votação</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
